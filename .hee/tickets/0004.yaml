  first -- which dirties tracked outputs (resume.*, tiles) that promote refuses, so
  the working order is build, restore tracked outputs, promote (measured at v1.2.0,
  2026-09-11). Either track the kind pages (gitignore exception plus forced add at
  cut) or have promote build from the release commit.'
