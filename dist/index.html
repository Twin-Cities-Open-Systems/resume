<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spencer Butler — TCOS Platform Stream</title>
    <style>
        :root { --bg: #111; --pane-bg: #1a1a1a; --text: #eee; --accent: #00ff00; --border: #333; --muted: #888; }
        body { font-family: monospace; background: var(--bg); color: var(--text); padding: 2rem; max-width: 800px; margin: 0 auto; }
        header { border-bottom: 1px solid var(--border); padding-bottom: 1rem; margin-bottom: 2rem; display: flex; justify-content: space-between; align-items: center; }
        select { background: var(--pane-bg); color: var(--accent); border: 1px solid #444; padding: 0.5rem; font-family: monospace; cursor: pointer; }
        .pane { background: var(--pane-bg); padding: 1.5rem; border-left: 3px solid var(--accent); border-radius: 4px; margin-bottom: 2rem; }
        h1, h2 { color: #fff; margin-top: 0; }
        p { line-height: 1.6; color: #ccc; }
        .post-list { list-style: none; padding: 0; }
        .post-item { background: var(--pane-bg); border: 1px solid var(--border); padding: 1rem; margin-bottom: 1rem; border-radius: 4px; }
        .post-meta { font-size: 0.85rem; color: var(--muted); margin-bottom: 0.5rem; }
        .post-content { color: #ccc; line-height: 1.5; white-space: pre-wrap; }
        .hash-pane { display: none; background: var(--pane-bg); border-left: 3px solid var(--accent); border-radius: 4px; padding: 1.5rem; margin-bottom: 2rem; }
        .hash-pane.found { display: block; }
        .hash-pane.notfound { display: block; border-left-color: #c33; }
        .hash-pane pre { white-space: pre-wrap; color: #ccc; background: #111; padding: 0.75rem; border-radius: 4px; overflow-x: auto; }
    </style>
</head>
<body>

    <header>
        <div><strong id="node-label">TCOS Node: loading&hellip;</strong></div>
        <div id="header-links"></div>
        <div>
            <label for="mode-select">Language Profile: </label>
            <select id="mode-select" onchange="switchLanguageProfile(this.value)">
                <option value="professional">professional</option>
                <option value="spencer">spencer</option>
                <option value="ninja">ninja</option>
                <option value="pirate">pirate</option>
                <option value="HwOps">HwOps</option>
            </select>
        </div>
    </header>

    <section class="pane">
        <h1 id="profile-title">Loading...</h1>
        <p id="profile-paradigm">Initial state synchronization in progress...</p>
    </section>

    <section id="hash-pane" class="hash-pane"></section>

    <section>
        <h2>Stream Entries</h2>
        <ul id="blog-posts" class="post-list"></ul>
    </section>

    <script>
        let coreProfiles = {};
        let blogEntries = [];

        // Real per-person media presences (<oper>.media.tcos.us). Only
        // people who actually have one appear here -- hand-maintained
        // until this and tcos-www's MEDIA_HOSTS share a real source.
        const MEDIA_HOSTS = { "spencer": "spencer.media.tcos.us" };

        // Real fix, 2026-08-28: "the blogs from lab link to live, fix
        // and prevent future drift." Two real bugs, same root cause --
        // nothing here was lab-aware. (1) public_dns in people.json is
        // only ever the real prod hostname, so the exact-match lookup
        // below always missed on any *.lab.tcos.us domain and silently
        // fell back to 'spencer' -- the exact bug this file's own
        // comment says was already fixed once for prod, just never
        // extended to lab. (2) MEDIA_HOSTS values are real prod
        // domains only, so the "Media" link always pointed at live
        // even when viewed from lab. Both fixed by normalizing the
        // real .lab.tcos.us suffix before matching/linking, matching
        // the same {person}.{service}[.lab].tcos.us shape
        // human-execution-engine's hee_hostmap already formalizes.
        const IS_LAB = /(^|\.)lab\.tcos\.us$/.test(window.location.hostname);
        const NORMALIZED_HOST = window.location.hostname.replace(/\.lab\.tcos\.us$/, '.tcos.us');

        async function initProfileEngine() {
            try {
                // Real trigger: this page was hardcoded to always fetch
                // spencer's profile.json regardless of which domain
                // (spencer.blog.tcos.us vs touchy.blog.tcos.us, etc.)
                // actually served it -- confirmed live, touchy.blog.tcos.us
                // was showing spencer's content. Fixed by looking up the
                // real slug for the current hostname in people.json first.
                const peopleRes = await fetch('people.json');
                const people = await peopleRes.json();
                const me = people.find(p => p.public_dns === NORMALIZED_HOST);
                const slug = me ? me.slug : 'spencer';

                document.getElementById('node-label').innerText = `TCOS Node: ${window.location.hostname}`;

                const links = [];
                links.push(`<a href="resume-${slug}.html">Resume &#8594;</a>`);
                if (MEDIA_HOSTS[slug]) {
                    const mediaHost = IS_LAB ? MEDIA_HOSTS[slug].replace(/\.tcos\.us$/, '.lab.tcos.us') : MEDIA_HOSTS[slug];
                    links.push(`<a href="https://${mediaHost}">Media &#8594;</a>`);
                }
                document.getElementById('header-links').innerHTML = links.join(' &middot; ');

                const profileRes = await fetch(`profiles/${slug}/profile.json`);
                const profileData = await profileRes.json();
                coreProfiles = profileData.language_profiles.payloads;

                const blogRes = await fetch('blog_manifest.json');
                blogEntries = await blogRes.json();

                const defaultMode = profileData.language_profiles.active_default || 'professional';
                document.getElementById('mode-select').value = defaultMode;
                switchLanguageProfile(defaultMode);
            } catch (error) {
                document.getElementById('profile-title').innerText = "Execution Error";
                document.getElementById('profile-paradigm').innerText = "Failed to pull data ledger matrices.";
            }
        }

        function switchLanguageProfile(mode) {
            if (coreProfiles[mode]) {
                document.getElementById('profile-title').innerText = coreProfiles[mode].title;
                document.getElementById('profile-paradigm').innerText = coreProfiles[mode].paradigm;
            }
            renderBlogEntries(mode);
        }

        // Real trigger, 2026-08-26 (Spencer: "keep json to a minimum ...
        // too much bloat to parse"): blog_manifest.json used to embed
        // every post's full text, 5 persona variants each -- the actual
        // real content already lives in profiles/<slug>/blog/*.md (git-
        // tracked, human-readable), so the JSON only needs to be a thin
        // index (slug/date/title/path) now. Post bodies are fetched on
        // demand, one plain-text .md per post, not pre-loaded for every
        // persona of every post up front.
        async function renderBlogEntries(mode) {
            const listContainer = document.getElementById('blog-posts');
            listContainer.innerHTML = '';

            for (const post of blogEntries) {
                const li = document.createElement('li');
                li.className = 'post-item';
                li.innerHTML = `
                    <div class="post-meta">[${post.date}] Sub-system: ${post.slug}</div>
                    <h3>${post.title}</h3>
                    <div class="post-content">Loading&hellip;</div>
                `;
                listContainer.appendChild(li);

                const contentDiv = li.querySelector('.post-content');
                try {
                    const res = await fetch(post.path);
                    if (!res.ok) throw new Error('not found');
                    contentDiv.textContent = await res.text();
                } catch (error) {
                    contentDiv.textContent = post.raw_fallback || '(content unavailable)';
                }
            }
        }

        // Real "hee-key hole" lookup: works for any real hash we generate
        // going forward, not just this one -- reads ?hash=, checks it
        // against a static manifest.json (no backend, "static is
        // perfect"), same real data hee-qr -manifest writes.
        // Exact query-param shape may get refined later; this is the
        // simple, fast first version.
        async function checkHashLookup() {
            const params = new URLSearchParams(window.location.search);
            const hash = params.get('hash');
            if (!hash) return;

            const pane = document.getElementById('hash-pane');
            try {
                const res = await fetch('manifest.json');
                const manifest = await res.json();
                const recipe = manifest[hash];
                if (recipe) {
                    pane.className = 'hash-pane found';
                    pane.innerHTML = `
                        <h2>Verified Artifact</h2>
                        <p>Real recipe, matches the hash embedded in this image's own anchor (QR + PNG metadata). Reproducible, bit-for-bit -- not asserted.</p>
                        <pre>${escapeHtmlHash(JSON.stringify(recipe, null, 2))}</pre>
                        <p class="post-meta">hash: ${escapeHtmlHash(hash)}</p>
                    `;
                } else {
                    pane.className = 'hash-pane notfound';
                    pane.innerHTML = `
                        <h2>Unknown Hash</h2>
                        <p>No recipe on file for this hash. Either it hasn't been published to the manifest yet, or it doesn't match anything real.</p>
                        <p class="post-meta">hash: ${escapeHtmlHash(hash)}</p>
                    `;
                }
            } catch (error) {
                pane.className = 'hash-pane notfound';
                pane.innerHTML = '<h2>Lookup Failed</h2><p>Could not load the manifest.</p>';
            }
        }

        function escapeHtmlHash(s) {
            return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }

        window.addEventListener('DOMContentLoaded', initProfileEngine);
        window.addEventListener('DOMContentLoaded', checkHashLookup);
    </script>
</body>
</html>
