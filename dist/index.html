<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">TCOS Node</title>
    <link rel="icon" type="image/x-icon" href="https://view.lab.tcos.us/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="https://view.lab.tcos.us/assets/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="https://view.lab.tcos.us/assets/favicon-16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="https://view.lab.tcos.us/assets/favicon-180.png">
    <meta property="og:site_name" content="TCOS Node">
    <meta property="og:title" id="og-title" content="TCOS Node">
    <meta property="og:description" id="og-description" content="Real per-operator TCOS node -- profile, resume, and blog stream.">
    <meta property="og:type" content="profile">
    <meta property="og:url" id="og-url" content="">
    <meta property="og:image" content="https://view.lab.tcos.us/assets/favicon-180.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://view.lab.tcos.us/assets/favicon-180.png">
    <meta name="description" id="meta-description" content="Real per-operator TCOS node -- profile, resume, and blog stream.">
    <link rel="canonical" id="canonical-link" href="">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
    <script>
    // Real oper theme choice (light/dark/auto), applied before first paint --
    // same pattern as view.lab.tcos.us, the gold-standard reference every
    // real Gold port in this org copies verbatim (2026-08-28).
    (function () {
      try {
        var t = localStorage.getItem("tcos-theme") || "dark";
        if (t !== "auto") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "dark");
      }
    })();
    </script>
    <style>
        /* SYNCED-FROM: view.lab.tcos.us's token palette (gold standard). */
        :root {
            --bg: #fbfbfa; --pane-bg: #ffffff; --text: #12181a; --muted: #7c8688;
            --border: #e2e4e0; --accent: #0d7d78; --accent-ink: #085e5a; --accent-soft: #e3f3f1;
            color-scheme: light;
        }
        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --bg: #0b0f0f; --pane-bg: #12181a; --text: #eef2f1; --muted: #6f7d7d;
                --border: #263030; --accent: #3fd4c8; --accent-ink: #7fe6dc; --accent-soft: #12302e;
                color-scheme: dark;
            }
        }
        :root[data-theme="dark"] {
            --bg: #0b0f0f; --pane-bg: #12181a; --text: #eef2f1; --muted: #6f7d7d;
            --border: #263030; --accent: #3fd4c8; --accent-ink: #7fe6dc; --accent-soft: #12302e;
            color-scheme: dark;
        }
        * { box-sizing: border-box; }
        body { font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; background: var(--bg); color: var(--text); padding: 2rem; max-width: 800px; margin: 0 auto; }
        .site-bar { display: flex; align-items: center; justify-content: flex-end; gap: 12px; margin-bottom: 1.5rem; }
        .theme-toggle { display: flex; align-items: center; gap: 4px; }
        .theme-toggle span { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 10px; color: var(--muted); margin-right: 2px; }
        .theme-btn { background: var(--pane-bg); border: 1px solid var(--border); color: var(--muted); font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 9.5px; font-weight: 700; padding: 0 7px; height: 22px; border-radius: 5px; cursor: pointer; line-height: 1; text-transform: uppercase; }
        .theme-btn.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-ink); }
        .fontsize-toggle { display: flex; align-items: center; gap: 6px; }
        .fontsize-toggle .fs-label { font-family: ui-monospace, monospace; font-size: 10px; color: var(--muted); cursor: default; user-select: none; }
        .fontsize-toggle .fs-options { display: flex; align-items: center; gap: 4px; max-width: 0; overflow: hidden; opacity: 0; transition: max-width .18s ease, opacity .12s ease; }
        .fontsize-toggle:hover .fs-options, .fontsize-toggle:focus-within .fs-options { max-width: 200px; opacity: 1; }
        .fontsize-btn { background: var(--pane-bg); border: 1px solid var(--border); color: var(--muted); font-family: ui-monospace, monospace; font-size: 10.5px; font-weight: 700; width: 22px; height: 22px; border-radius: 5px; cursor: pointer; line-height: 1; }
        .fontsize-btn.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-ink); }
        body[data-fontsize="s"] { zoom: 0.875; }
        body[data-fontsize="m"] { zoom: 1; }
        body[data-fontsize="l"] { zoom: 1.125; }
        body[data-fontsize="xl"] { zoom: 1.25; }
        body[data-fontsize="xxl"] { zoom: 1.375; }
        .lu-row { display: flex; flex-wrap: wrap; gap: 4px 14px; font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 11px; color: var(--muted); margin: 0.5rem 0 1.5rem; }
        .lu-row b { color: var(--text); font-weight: 600; }
        header { border-bottom: 1px solid var(--border); padding-bottom: 1rem; margin-bottom: 1.5rem; display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 8px; }
        header strong { font-family: "JetBrains Mono", ui-monospace, monospace; color: var(--text); }
        header a { color: var(--accent-ink); text-decoration: none; font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 0.85rem; }
        header a:hover { text-decoration: underline; }
        .pane { background: var(--pane-bg); border: 1px solid var(--border); padding: 1.5rem; border-left: 3px solid var(--accent); border-radius: 8px; margin-bottom: 2rem; }
        h1, h2 { color: var(--text); margin-top: 0; font-family: "JetBrains Mono", ui-monospace, monospace; }
        p { line-height: 1.6; color: var(--muted); }
        .post-list { list-style: none; padding: 0; }
        .post-item { background: var(--pane-bg); border: 1px solid var(--border); border-left: 3px solid var(--accent); padding: 1rem 1.25rem; margin-bottom: 1rem; border-radius: 8px; }
        .post-meta { font-size: 0.85rem; color: var(--muted); margin-bottom: 0.5rem; font-family: "JetBrains Mono", ui-monospace, monospace; }
        .post-content { color: var(--muted); line-height: 1.5; white-space: pre-wrap; }
        .hash-pane { display: none; background: var(--pane-bg); border-left: 3px solid var(--accent); border-radius: 8px; padding: 1.5rem; margin-bottom: 2rem; border: 1px solid var(--border); }
        .hash-pane.found { display: block; }
        .hash-pane.notfound { display: block; border-left-color: #c93030; }
        .hash-pane pre { white-space: pre-wrap; color: var(--muted); background: var(--bg); padding: 0.75rem; border-radius: 4px; overflow-x: auto; }
    </style>
</head>
<body>

    <div class="site-bar">
        <div class="theme-toggle">
            <span>Theme</span>
            <button class="theme-btn" data-theme-choice="light" type="button">Light</button>
            <button class="theme-btn" data-theme-choice="dark" type="button">Dark</button>
            <button class="theme-btn" data-theme-choice="auto" type="button">Auto</button>
        </div>
        <div class="fontsize-toggle">
            <span class="fs-label" tabindex="0">Aa</span>
            <div class="fs-options">
                <button class="fontsize-btn" data-size="s" type="button">S</button>
                <button class="fontsize-btn" data-size="m" type="button">M</button>
                <button class="fontsize-btn" data-size="l" type="button">L</button>
                <button class="fontsize-btn" data-size="xl" type="button">XL</button>
                <button class="fontsize-btn" data-size="xxl" type="button">XXL</button>
            </div>
        </div>
    </div>

    <header>
        <strong id="node-label">TCOS Node: loading&hellip;</strong>
        <div id="header-links"></div>
    </header>

    <div class="lu-row">
        <span><b>lu:</b> <time class="lu-iso" datetime="2026-08-28T14:00:00Z">2026-08-28T14:00:00Z</time> &middot; <span class="lu-human"></span> &middot; <span class="lu-delta"></span></span>
    </div>

    <section class="pane">
        <h1 id="profile-title">Loading...</h1>
        <p id="profile-paradigm">Initial state synchronization in progress...</p>
    </section>

    <section id="hash-pane" class="hash-pane"></section>

    <section>
        <h2>Stream Entries</h2>
        <ul id="blog-posts" class="post-list"></ul>
    </section>

    <script>
        let blogEntries = [];

        // Real fix, 2026-08-28: "the blogs from lab link to live, fix
        // and prevent future drift." Two real bugs, same root cause --
        // nothing here was lab-aware. (1) public_dns in people.json is
        // only ever the real prod hostname, so the exact-match lookup
        // below always missed on any *.lab.tcos.us domain and silently
        // fell back to 'spencer' -- the exact bug this file's own
        // comment says was already fixed once for prod, just never
        // extended to lab. (2) MEDIA_HOSTS values are real prod
        // domains only, so the "Media" link always pointed at live
        // even when viewed from lab. Both fixed by normalizing the
        // real .lab.tcos.us suffix before matching/linking, matching
        // the same {person}.{service}[.lab].tcos.us shape
        // human-execution-engine's hee_hostmap already formalizes.
        const IS_LAB = /(^|\.)lab\.tcos\.us$/.test(window.location.hostname);
        const NORMALIZED_HOST = window.location.hostname.replace(/\.lab\.tcos\.us$/, '.tcos.us');

        async function initProfileEngine() {
            try {
                // Real trigger: this page was hardcoded to always fetch
                // spencer's profile.json regardless of which domain
                // (spencer.blog.tcos.us vs touchy.blog.tcos.us, etc.)
                // actually served it -- confirmed live, touchy.blog.tcos.us
                // was showing spencer's content. Fixed by looking up the
                // real slug for the current hostname in people.json first.
                const peopleRes = await fetch('people.json');
                const people = await peopleRes.json();
                const me = people.find(p => p.public_dns === NORMALIZED_HOST);
                const slug = me ? me.slug : 'spencer';
                // Real fallback-safe lookup: when the hostname isn't
                // in people.json at all (me is undefined), still find
                // the 'spencer' record by slug so media_dns behaves
                // the same as every other fallback field here.
                const mePerson = me || people.find(p => p.slug === slug);

                document.getElementById('node-label').innerText = `TCOS Node: ${window.location.hostname}`;
                document.getElementById('page-title').innerText = `${window.location.hostname} — TCOS Node`;
                document.getElementById('og-title').setAttribute('content', `${window.location.hostname} — TCOS Node`);
                document.getElementById('og-url').setAttribute('content', `https://${NORMALIZED_HOST}/`);
                document.getElementById('canonical-link').setAttribute('href', `https://${NORMALIZED_HOST}/`);

                const links = [];
                links.push(`<a href="resume-${slug}.html">Resume &#8594;</a>`);
                // Real "set it and forget it" fix: media_dns comes
                // straight from people.json (already fetched above,
                // sourced from each person's own profile.json) -- no
                // second hardcoded MEDIA_HOSTS list to drift out of
                // sync with media-hub.html's copy.
                if (mePerson && mePerson.media_dns) {
                    const mediaHost = IS_LAB ? mePerson.media_dns.replace(/\.tcos\.us$/, '.lab.tcos.us') : mePerson.media_dns;
                    links.push(`<a href="https://${mediaHost}">Media &#8594;</a>`);
                }
                document.getElementById('header-links').innerHTML = links.join(' &middot; ');

                const profileRes = await fetch(`profiles/${slug}/profile.json`);
                const profileData = await profileRes.json();

                const blogRes = await fetch('blog_manifest.json');
                blogEntries = await blogRes.json();

                // Real removal, 2026-08-28 (Spencer, direct: "ditch all
                // the persona shit"): no more multi-mode payloads, no
                // more active_default selection -- one real, fixed
                // identity per person, sourced from profile.json's own
                // "professional" payload (already real content, not
                // invented here). The public Language Profile switcher
                // UI was removed first; this removes the underlying
                // multi-persona machinery it was ever switching between.
                const identity = profileData.language_profiles.payloads.professional;
                renderProfile(identity);
            } catch (error) {
                document.getElementById('profile-title').innerText = "Execution Error";
                document.getElementById('profile-paradigm').innerText = "Failed to pull data ledger matrices.";
            }
        }

        function renderProfile(identity) {
            if (identity) {
                document.getElementById('profile-title').innerText = identity.title;
                document.getElementById('profile-paradigm').innerText = identity.paradigm;
                document.getElementById('og-description').setAttribute('content', identity.paradigm);
                document.getElementById('meta-description').setAttribute('content', identity.paradigm);
            }
            renderBlogEntries();
        }

        // Real trigger, 2026-08-26 (Spencer: "keep json to a minimum ...
        // too much bloat to parse"): blog_manifest.json used to embed
        // every post's full text, 5 persona variants each -- the actual
        // real content already lives in profiles/<slug>/blog/*.md (git-
        // tracked, human-readable), so the JSON only needs to be a thin
        // index (slug/date/title/path) now. Post bodies are fetched on
        // demand, one plain-text .md per post, not pre-loaded for every
        // persona of every post up front.
        async function renderBlogEntries() {
            const listContainer = document.getElementById('blog-posts');
            listContainer.innerHTML = '';

            for (const post of blogEntries) {
                const li = document.createElement('li');
                li.className = 'post-item';
                li.innerHTML = `
                    <div class="post-meta">[${post.date}] Sub-system: ${post.slug}</div>
                    <h3>${post.title}</h3>
                    <div class="post-content">Loading&hellip;</div>
                `;
                listContainer.appendChild(li);

                const contentDiv = li.querySelector('.post-content');
                try {
                    const res = await fetch(post.path);
                    if (!res.ok) throw new Error('not found');
                    contentDiv.textContent = await res.text();
                } catch (error) {
                    contentDiv.textContent = post.raw_fallback || '(content unavailable)';
                }
            }
        }

        // Real "hee-key hole" lookup: works for any real hash we generate
        // going forward, not just this one -- reads ?hash=, checks it
        // against a static manifest.json (no backend, "static is
        // perfect"), same real data hee-qr -manifest writes.
        // Exact query-param shape may get refined later; this is the
        // simple, fast first version.
        async function checkHashLookup() {
            const params = new URLSearchParams(window.location.search);
            const hash = params.get('hash');
            if (!hash) return;

            const pane = document.getElementById('hash-pane');
            try {
                const res = await fetch('manifest.json');
                const manifest = await res.json();
                const recipe = manifest[hash];
                if (recipe) {
                    pane.className = 'hash-pane found';
                    pane.innerHTML = `
                        <h2>Verified Artifact</h2>
                        <p>Real recipe, matches the hash embedded in this image's own anchor (QR + PNG metadata). Reproducible, bit-for-bit -- not asserted.</p>
                        <pre>${escapeHtmlHash(JSON.stringify(recipe, null, 2))}</pre>
                        <p class="post-meta">hash: ${escapeHtmlHash(hash)}</p>
                    `;
                } else {
                    pane.className = 'hash-pane notfound';
                    pane.innerHTML = `
                        <h2>Unknown Hash</h2>
                        <p>No recipe on file for this hash. Either it hasn't been published to the manifest yet, or it doesn't match anything real.</p>
                        <p class="post-meta">hash: ${escapeHtmlHash(hash)}</p>
                    `;
                }
            } catch (error) {
                pane.className = 'hash-pane notfound';
                pane.innerHTML = '<h2>Lookup Failed</h2><p>Could not load the manifest.</p>';
            }
        }

        function escapeHtmlHash(s) {
            return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }

        window.addEventListener('DOMContentLoaded', initProfileEngine);
        window.addEventListener('DOMContentLoaded', checkHashLookup);

        // Theme toggle -- ported verbatim from the Gold reference
        // implementation (.github/bin/render-review.py's embedded
        // script), same as tcos-www's shell/tc-theme.js.
        (function () {
            var TH_KEY = "tcos-theme";
            function markActive(choice) {
                document.querySelectorAll(".theme-btn").forEach(function (b) {
                    b.classList.toggle("active", b.dataset.themeChoice === choice);
                });
            }
            var saved = "dark";
            try { saved = localStorage.getItem(TH_KEY) || "dark"; } catch (e) {}
            markActive(saved);
            document.querySelectorAll(".theme-btn").forEach(function (b) {
                b.addEventListener("click", function () {
                    var choice = b.dataset.themeChoice;
                    try { localStorage.setItem(TH_KEY, choice); } catch (e) {}
                    if (choice === "auto") {
                        document.documentElement.removeAttribute("data-theme");
                    } else {
                        document.documentElement.setAttribute("data-theme", choice);
                    }
                    markActive(choice);
                });
            });
        })();

        // Font-size toggle -- same reference implementation.
        (function () {
            var FS_KEY = "tcos-fontsize";
            function applyFontsize(size) {
                document.body.setAttribute("data-fontsize", size);
                document.querySelectorAll(".fontsize-btn").forEach(function (b) {
                    b.classList.toggle("active", b.dataset.size === size);
                });
            }
            var savedSize = "m";
            try { savedSize = localStorage.getItem(FS_KEY) || "m"; } catch (e) {}
            applyFontsize(savedSize);
            document.querySelectorAll(".fontsize-btn").forEach(function (b) {
                b.addEventListener("click", function () {
                    try { localStorage.setItem(FS_KEY, b.dataset.size); } catch (e) {}
                    applyFontsize(b.dataset.size);
                    b.blur();
                });
            });
        })();

        // lu: freshness row -- same reference implementation.
        (function () {
            var isoEl = document.querySelector(".lu-iso");
            if (!isoEl) return;
            var generated = new Date(isoEl.getAttribute("datetime"));
            var humanEl = document.querySelector(".lu-human");
            var deltaEl = document.querySelector(".lu-delta");
            if (humanEl) {
                humanEl.textContent = generated.toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" });
            }
            function renderDelta() {
                if (!deltaEl) return;
                var ms = Date.now() - generated.getTime();
                var mins = Math.floor(ms / 60000);
                var label;
                if (mins < 1) label = "just now";
                else if (mins < 60) label = mins + "m ago";
                else if (mins < 60 * 24) label = Math.floor(mins / 60) + "h" + (mins % 60) + "m ago";
                else label = Math.floor(mins / (60 * 24)) + "d ago";
                deltaEl.textContent = label;
            }
            renderDelta();
            setInterval(renderDelta, 30000);
        })();
    </script>
</body>
</html>
