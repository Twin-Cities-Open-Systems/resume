spec:
  question: "What must the VE team do if an examinee scores a passing grade on all examination elements needed for an upgrade or new license?"
  answer: "Three VEs must certify that the examinee is qualified for the license grant and that they have complied with the administering VE requirements"
  id: E1E11
  correct: B
  choices:
    A: "Photocopy all examination documents and forward them to the FCC for processing"
    B: "Three VEs must certify that the examinee is qualified for the license grant and that they have complied with the administering VE requirements"
    C: "Issue the examinee the new or upgrade license"
    D: "All these choices are correct"
