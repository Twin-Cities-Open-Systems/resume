spec:
  question: "What limitations may the FCC place on an amateur station if its signal causes interference to domestic broadcast reception, assuming that the receivers involved are of good engineering design?"
  answer: "The amateur station must avoid transmitting during certain hours on frequencies that cause the interference"
  id: E1B08
  correct: D
  choices:
    A: "The amateur station must cease operation"
    B: "The amateur station must cease operation on all frequencies below 30 MHz"
    C: "The amateur station must cease operation on all frequencies above 30 MHz"
    D: "The amateur station must avoid transmitting during certain hours on frequencies that cause the interference"
  rule_ref: "97.121"
