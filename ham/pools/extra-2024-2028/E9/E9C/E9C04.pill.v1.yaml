  question: "What happens to the radiation pattern of an unterminated long wire antenna as the wire length is increased?"
  answer: "Additional lobes form with major lobes increasingly aligned with the axis of the antenna"
  id: E9C04
  correct: B
  choices:
    A: "Fewer lobes form with the major lobes increasing closer to broadside to the wire"
    B: "Additional lobes form with major lobes increasingly aligned with the axis of the antenna"
