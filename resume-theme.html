<style>
  :root { --bg: #111; --pane-bg: #1a1a1a; --text: #eee; --accent: #00ff00; --border: #333; --muted: #888; }
  body { font-family: monospace; background: var(--bg); color: var(--text); padding: 2rem; max-width: 700px; margin: 0 auto; line-height: 1.6; }
  h1, h2, h3 { color: #fff; }
  h1 { border-bottom: 1px solid var(--border); padding-bottom: 0.5rem; }
  a { color: var(--accent); }
  a:hover { text-decoration: none; }
  code, pre { background: var(--pane-bg); color: var(--text); }
  hr { border-color: var(--border); }
  blockquote { border-left: 3px solid var(--accent); margin-left: 0; padding-left: 1rem; color: var(--muted); }
</style>
