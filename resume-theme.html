<!-- Real dark-theme snippet for pandoc-generated resume.html, passed via
     `-H resume-theme.html`. Real bug this fixes: pandoc's own default
     resume.html output has zero styling (bare white background) --
     matches the site's real dark theme (same token values as
     media/spencer/dist/shell-theme.css) rather than inventing a
     second, unrelated palette. Dark-only by design: a printed/emailed
     resume gets read on whatever device opens it, but the *web*
     rendering should match the rest of spencer.blog.tcos.us, not look
     like a stray unstyled pandoc default. -->
<style>
  :root {
    --ground: #0b1211; --surface: #101918; --line: #223330;
    --ink: #e7efec; --ink-dim: #9db3ae; --ink-faint: #5f7a75;
    --accent: #2bbdb2; --accent-ink: #7fe0d6;
  }
  html { background-color: var(--ground); color: var(--ink); }
  body {
    background-color: var(--ground); color: var(--ink);
    font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif;
  }
  h1, h2, h3, h4 { color: var(--ink); }
  h2 { border-bottom: 1px solid var(--line); padding-bottom: 0.3em; }
  a { color: var(--accent-ink); }
  code { background-color: var(--surface); color: var(--ink); }
  hr { border-color: var(--line); }
  blockquote { color: var(--ink-dim); border-left: 2px solid var(--line); }
</style>
